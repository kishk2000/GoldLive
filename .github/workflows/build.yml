name: Build GoldLive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show project files
        run: |
          echo "=== PROJECT ==="
          find . -maxdepth 5 -type f | sort
          echo "=== GRADLE ==="
          gradle --version

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldLive-APK
          path: app/build/outputs/apk/debug/app-debug.apk
